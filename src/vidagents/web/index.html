<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vidagents - theo dõi</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--soft:#f1efe8;--text:#1f1e1d;--text2:#5f5e5a;--muted:#888780;--line:#e3e1d8;
--acc:#185fa5;--accbg:#e6f1fb;--ok:#3b6d11;--okbg:#eaf3de;--warn:#854f0b;--warnbg:#faeeda;--bad:#a32d2d;--badbg:#fcebeb}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b1a;--card:#262524;--soft:#2f2e2c;--text:#f0eee6;--text2:#b4b2a9;--muted:#888780;--line:#3a3937;
--acc:#85b7eb;--accbg:#0c447c;--ok:#c0dd97;--okbg:#27500a;--warn:#fac775;--warnbg:#633806;--bad:#f7c1c1;--badbg:#791f1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:19px;font-weight:600;margin:0}
h3{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--text2)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 10px;border-radius:8px;background:var(--soft);color:var(--text2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.layout{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px}
@media (max-width:800px){.layout{grid-template-columns:1fr}}
.job{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px;cursor:pointer}
.job.sel{outline:2px solid var(--acc)}
.job b{font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--text2);font-size:13px}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.bd{font-size:12px;padding:2px 8px;border-radius:8px;white-space:nowrap}
.s-queued,.s-pending,.s-idle{background:var(--soft);color:var(--text2)}
.s-running,.s-active{background:var(--accbg);color:var(--acc)}
.s-done{background:var(--okbg);color:var(--ok)}
.s-waiting_approval,.s-waiting_info,.s-waiting{background:var(--warnbg);color:var(--warn)}
.s-blocked,.s-cancelled,.s-stopped{background:var(--badbg);color:var(--bad)}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:12px;background:var(--warnbg);color:var(--warn)}
.banner.bad{background:var(--badbg);color:var(--bad)}
.banner.ok{background:var(--okbg);color:var(--ok)}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ms{font-size:12px;padding:5px 9px;border-radius:8px;border:1px solid var(--line)}
.ms small{display:block;color:inherit;opacity:.75;font-size:11px}
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:14px}
.ag{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.ag.active{border:2px solid var(--acc);padding:9px 11px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:14px}
.lg{font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--text2);padding:3px 0;border-bottom:1px solid var(--line)}
.f{font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
code{font:12px ui-monospace,Consolas,monospace;background:var(--soft);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>vidagents &middot; theo dõi job</h1><div class="chips" id="chips"></div></div>
  <div class="layout">
    <div id="list"></div>
    <div id="detail"><div class="card empty">Chưa có job nào. Giao job qua Telegram (<code>/video</code>) rồi quay lại đây.</div></div>
  </div>
  <p class="mut" style="margin-top:18px">Chỉ để xem, tự làm mới mỗi 2 giây. Duyệt, sửa, hủy vẫn làm qua Telegram.</p>
</div>
<script>
const ST={queued:'Xếp hàng',running:'Đang chạy',waiting_info:'Chờ thông tin',waiting_approval:'Chờ duyệt',blocked:'Bị dừng',done:'Xong',cancelled:'Đã hủy'};
const MS={done:'Xong',active:'Đang làm',waiting:'Chờ người',stopped:'Dừng',pending:'Chưa tới'};
const AG={active:'Đang làm',done:'Đã làm',idle:'Chưa tới lượt'};
const HUMAN={human:'Người giao',orchestrator:'Điều phối',script:'Script',footage:'Footage',edit:'Edit',critic:'Critic'};
let sel=null,ov=null,pinned=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=t=>t?String(t).slice(11,19):'';
const usd=n=>n==null?'-':'$'+Number(n).toFixed(2);
async function get(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json();}

function bannerFor(j){
  if(j.status==='blocked')return `<div class="banner bad">Job bị dừng: ${esc(j.note||'không rõ lý do')}. Sau khi xử lý, gõ <code>/tieptuc ${esc(j.job_id)}</code>; nếu do chạm trần chi phí gõ <code>/nangtran ${esc(j.job_id)} &lt;USD&gt;</code>.</div>`;
  if(j.status==='cancelled')return `<div class="banner bad">Job đã hủy${j.note?': '+esc(j.note):''}.</div>`;
  if(j.status==='done')return `<div class="banner ok">Hoàn thành. Hệ thống không tự đăng bài, người giao kiểm tra rồi đăng.</div>`;
  const w=j.waiting_for;
  if(w==='approve_1')return `<div class="banner">Đang chờ người giao duyệt lần 1 (kịch bản và hướng dựng). Duyệt bằng <code>/duyet ${esc(j.job_id)}</code> hoặc góp ý <code>/sua ${esc(j.job_id)} ...</code> trên Telegram.</div>`;
  if(w==='approve_2')return `<div class="banner">Đang chờ người giao duyệt lần 2 (bản xem trước) trước khi render. <code>/duyet ${esc(j.job_id)}</code></div>`;
  if(w==='info')return `<div class="banner">Đang chờ người giao trả lời thông tin còn thiếu. <code>/bosung ${esc(j.job_id)} ...</code></div>`;
  if(w==='escalate'){const e=j.escalation||{};return `<div class="banner bad">Vượt giới hạn vòng sửa, cần người quyết: ${esc(e.reason||e.text||e.kind||'xem tin nhắn Telegram')}</div>`;}
  if(w)return `<div class="banner">Đang chờ người giao.</div>`;
  if(j.stalled)return `<div class="banner bad">Job không nhúc nhích quá ${ov?ov.stall_minutes:60} phút. Kiểm tra máy render hoặc NAS.</div>`;
  return '';
}

function renderList(){
  const L=$('list');
  if(!ov||!ov.jobs.length){L.innerHTML='<div class="card empty">Chưa có job.</div>';return;}
  const jobs=[...ov.jobs].sort((a,b)=>(b.updated_at||'').localeCompare(a.updated_at||''));
  if(!sel||!jobs.find(j=>j.job_id===sel))sel=jobs[0].job_id;
  L.innerHTML=jobs.map(j=>`<div class="job ${j.job_id===sel?'sel':''}" data-id="${esc(j.job_id)}">
    <div class="row"><b>${esc(j.job_id)}</b><span class="bd s-${esc(j.status)}">${esc(ST[j.status]||j.status)}</span></div>
    <div class="mut">${esc(j.brand)} &middot; ${esc(j.video_type)}</div>
    <div class="row mut"><span>${j.stalled?'Có thể đang đứng':esc(j.requester)}</span><span>${usd(j.usd)}</span></div>
    <div class="bar"><i style="width:${j.progress}%"></i></div></div>`).join('');
  L.querySelectorAll('.job').forEach(n=>n.onclick=()=>{sel=n.dataset.id;pinned=true;renderList();loadDetail();});
}

function renderChips(){
  if(!ov)return;
  const c=ov.counts,n=k=>c[k]||0;
  const run=n('running')+n('queued'),wait=n('waiting_approval')+n('waiting_info');
  const s=ov.render_slots?`Suất render ${ov.render_slots.busy}/${ov.render_slots.total}`:'';
  $('chips').innerHTML=[`Đang chạy ${run}`,`Chờ người ${wait}`,`Bị dừng ${n('blocked')}`,`Xong ${n('done')}`,s,`Chi phí AI ${usd(ov.total_usd)}`].filter(Boolean).map(t=>`<span class="chip">${esc(t)}</span>`).join('');
}

function renderDetail(j){
  const D=$('detail');
  const a=j.agents.map(x=>`<div class="ag ${x.state==='active'?'active':''}"><div class="row"><b>${esc(x.name)}</b><span class="bd s-${x.state}">${AG[x.state]}</span></div>
    <div class="mut" style="min-height:20px">${esc(x.last||'Chưa làm gì')}${x.last_at?' &middot; '+hm(x.last_at):''}</div>
    <div class="mut">${x.steps} bước &middot; ${x.calls} lượt AI &middot; ${usd(x.usd)}</div></div>`).join('');
  const m=j.milestones.map(x=>`<div class="ms s-${x.state}">${esc(x.label)}<small>${esc(HUMAN[x.agent]||x.agent)} &middot; ${MS[x.state]}</small></div>`).join('');
  const c=j.critic,fs=c.findings.length?c.findings.map(f=>`<div class="f"><span class="bd s-${f.severity==='nang'?'blocked':'waiting'}">${f.severity==='nang'?'Nặng':'Vừa'}</span> ${f.at!=null?'giây '+esc(f.at)+': ':''}${esc(f.desc)}</div>`).join(''):'<div class="mut">Chưa có phát hiện nào.</div>';
  const r=j.rounds,k=j.cost;
  const steps=[...j.steps].reverse().map(s=>`<div class="lg">${hm(s.at)}  <b>${esc(s.label)}</b> (${esc(HUMAN[s.agent]||s.agent)})${s.status!=='ok'?' - '+esc(s.status):''}</div>`).join('')||'<div class="mut">Chưa có bước nào.</div>';
  const outs=Object.entries(j.outputs||{}).map(([k2,v])=>`<div class="lg">${esc(k2)}: ${esc(v)}</div>`).join('');
  D.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="row"><div><b style="font-size:16px">${esc(j.job_id)}</b>
      <div class="mut">${esc(j.brand)} &middot; ${esc(j.video_type)} &middot; ${esc(j.requester)}${j.mode?' &middot; chế độ '+esc(j.mode):''}</div></div>
      <span class="bd s-${esc(j.status)}">${esc(ST[j.status]||j.status)}</span></div>
      <div class="bar"><i style="width:${j.progress}%"></i></div><div class="mut" style="margin-top:4px">${j.progress}% &middot; cập nhật ${hm(j.updated_at)}</div></div>
    ${bannerFor(j)}${j.checkpoint_error?`<div class="banner bad">Không đọc được checkpoint (${esc(j.checkpoint_error)}). Đang hiển thị theo sổ job.</div>`:''}
    <h3>Tiến trình</h3><div class="flow">${m}</div>
    <h3>Các agent</h3><div class="agents">${a}</div>
    <div class="two"><div class="card"><h3>Critic${c.stage?' ('+esc(c.stage)+')':''}: ${c.heavy} nặng, ${c.mid} vừa</h3>${fs}
        <h3 style="margin-top:12px">Vòng sửa</h3><div class="mut">Critic ${r.critic_fix}/${r.critic_max} &middot; Người duyệt ${r.human}/${r.human_max} &middot; Hỏi thêm ${r.info}/${r.info_max}</div></div>
      <div class="card"><h3>Chi phí AI</h3><div style="font-size:22px;font-weight:600">${usd(k.usd)}${k.cap?` <span class="mut">/ ${usd(k.cap)}</span>`:''}</div>
        <div class="mut">${k.calls} lượt gọi &middot; ${k.input_tokens.toLocaleString('vi-VN')} token vào &middot; ${k.output_tokens.toLocaleString('vi-VN')} ra</div>
        ${k.unpriced_models.length?`<div class="mut">Chưa có giá cho: ${esc(k.unpriced_models.join(', '))}</div>`:''}${outs?'<h3 style="margin-top:12px">Kết quả</h3>'+outs:''}</div></div>
    <div class="card"><h3>Nhật ký các bước (mới nhất trước)</h3>${steps}</div>`;
}

async function loadDetail(){
  if(!sel)return;
  try{renderDetail(await get('/api/jobs/'+encodeURIComponent(sel)));}catch(e){$('detail').innerHTML='<div class="card empty">Không tải được job này.</div>';}
}
async function tick(){
  try{ov=await get('/api/overview');renderChips();renderList();await loadDetail();}
  catch(e){$('chips').innerHTML='<span class="chip">Mất kết nối với máy chủ dashboard</span>';}
}
tick();setInterval(tick,2000);
</script>
</body>
</html>
